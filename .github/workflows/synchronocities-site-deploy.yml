name: synchronocities-site deploy

# Builds the Astro site and deploys it to Cloudflare Workers Static Assets.
# Until this existed the site was deployed by hand.
#
#   live: https://synchronocities.tryambakam.space
#   config: wrangler.jsonc (repo ROOT — not workers/wrangler.toml, which is the
#           separate AI Worker; see .github/workflows/synchronocities-ai-deploy.yml)
#
# Secrets required (already present for the AI Worker workflow):
#   CLOUDFLARE_API_TOKEN   — scoped: Workers Scripts: Edit, Account: Read
#   CLOUDFLARE_ACCOUNT_ID  — 9d9d23b27f32e70ae3afb6a1aa2c0f10
#
# `npm run build` runs validate:posts via prebuild, so malformed frontmatter
# fails the deploy rather than shipping.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/synchronocities-site-deploy.yml'
  workflow_dispatch:

# One deploy at a time; let a newer push supersede an in-flight build.
concurrency:
  group: site-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build + deploy site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Guard against the class of bug that shipped a dead canonical host: the
      # four text endpoints derive `site` from astro.config.mjs, but robots.txt
      # is still hand-written, so a host change can half-land.
      - name: Assert canonical host is consistent
        run: |
          expected="synchronocities.tryambakam.space"
          fail=0
          for f in dist/robots.txt dist/llms.txt dist/start.txt dist/llms-manifest.json; do
            if grep -q "synchronocities\.tryambakam\.com" "$f"; then
              echo "::error file=$f::still references the unusable .com canonical"
              fail=1
            fi
            if ! grep -q "$expected" "$f"; then
              echo "::error file=$f::does not reference $expected"
              fail=1
            fi
          done
          [ "$fail" = "0" ] && echo "▸ canonical host consistent across generated surfaces"
          exit $fail

      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Smoke-test the live site
        run: |
          S=https://synchronocities.tryambakam.space
          fail=0
          for path in / /robots.txt /llms.txt /sitemap-index.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 --retry 3 --retry-delay 5 "$S$path")
            if [ "$code" = "200" ]; then echo "  ok   $path"; else echo "::error::$path returned $code"; fail=1; fi
          done
          cc=$(curl -sI --max-time 30 "$S/" | tr -d '\r' | grep -i '^cache-control:' | cut -d' ' -f2-)
          echo "  html cache-control: $cc"
          # _headers rules are cumulative; a spliced value means the /* rule leaked in.
          if [ "$(grep -c 'max-age' <<< "$cc")" != "1" ] && [ -n "$cc" ]; then
            echo "::warning::HTML Cache-Control looks spliced — check public/_headers '! Cache-Control' unsets"
          fi
          exit $fail
