name: synchronocities-ai deploy + index

# Deploys the Cloudflare Worker on every push that touches workers/,
# then re-indexes the corpus if any post content changed.
#
# Required secrets on the repo:
#   CLOUDFLARE_API_TOKEN   — scoped: Workers Scripts: Edit, Vectorize: Edit,
#                            KV Storage: Edit, R2: Edit, Account: Read
#   CLOUDFLARE_ACCOUNT_ID  — same one shown by `wrangler whoami`
#   ADMIN_API_KEY          — shared secret gating admin routes (/embed/batch
#                            etc.) on the Worker; must match the Worker Secret
#                            set via `wrangler secret put ADMIN_API_KEY`
#
# Notes:
#   - NVIDIA_API_KEY is NOT in repo secrets — it's a Worker Secret set once
#     via `wrangler secret put NVIDIA_API_KEY` from the local machine
#   - This workflow doesn't require the NVIDIA_API_KEY since `wrangler deploy`
#     doesn't touch Worker Secrets; they're managed independently

on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - 'src/content/posts/**'
      - '.github/workflows/synchronocities-ai-deploy.yml'
  workflow_dispatch:
    inputs:
      reindex:
        description: 'Force reindex all posts (ignores content hashes)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    outputs:
      worker_url: ${{ steps.deploy.outputs.url }}
      workers_changed: ${{ steps.changes.outputs.workers }}
      posts_changed: ${{ steps.changes.outputs.posts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Detect changes by diffing the whole push range rather than reading
      # github.event.head_commit. The old gate inspected only the HEAD commit, so
      # a push whose workers/ edits sat in any earlier commit skipped the deploy
      # entirely — observed 2026-09-11 on 80527fa, which modified three files
      # under workers/ and was still skipped.
      - name: Detect changed paths
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "workers=true" >> "$GITHUB_OUTPUT"
            echo "posts=true"   >> "$GITHUB_OUTPUT"
            echo "▸ manual dispatch — treating everything as changed"
            exit 0
          fi
          before="${{ github.event.before }}"
          # All-zero SHA means a new branch; fall back to the first parent.
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            before=$(git rev-parse "${{ github.sha }}^" 2>/dev/null || echo "")
          fi
          if [ -n "$before" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$before" "${{ github.sha }}")
          else
            changed=$(git show --name-only --format= "${{ github.sha }}")
          fi
          echo "▸ changed files in push range:"; echo "$changed" | sed 's/^/    /'
          grep -q '^workers/'           <<< "$changed" && w=true || w=false
          grep -q '^src/content/posts/' <<< "$changed" && p=true || p=false
          echo "workers=$w" >> "$GITHUB_OUTPUT"
          echo "posts=$p"   >> "$GITHUB_OUTPUT"
          echo "▸ workers=$w posts=$p"
      - uses: oven-sh/setup-bun@v2
        if: steps.changes.outputs.workers == 'true'
        with:
          bun-version: latest
      - name: Install dependencies
        if: steps.changes.outputs.workers == 'true'
        working-directory: workers
        run: bun install --frozen-lockfile
      # Cheap guard: refuse to ship a Worker configured to call a model that left
      # the NIM catalog. --warn because the snapshot can lag a same-day retirement
      # and a stale snapshot should not block an unrelated deploy; the daily probe
      # job is the one that fails hard.
      - name: Check configured models against the reachability snapshot
        if: steps.changes.outputs.workers == 'true'
        working-directory: workers
        run: bun scripts/assert-models-reachable.ts --warn

      - name: Deploy
        id: deploy
        if: steps.changes.outputs.workers == 'true'
        working-directory: workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # --config is REQUIRED: a bare `wrangler deploy` from workers/ resolves the
          # repo-root wrangler.jsonc and ships the SITE Worker instead.
          bunx wrangler deploy --config ./wrangler.toml
          echo "url=https://synchronocities-ai.tryambakam.space" >> "$GITHUB_OUTPUT"

  index:
    name: Reindex corpus
    runs-on: ubuntu-latest
    needs: deploy
    if: |
      always() &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') &&
      needs.deploy.outputs.posts_changed == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install workers deps (for the script)
        working-directory: workers
        run: bun install --frozen-lockfile
      - name: Index corpus
        working-directory: workers
        env:
          # /embed/batch is admin-gated; the script fails fast without this.
          # Value is never printed — passed to the script process env only.
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          if [ "${{ inputs.reindex }}" = "true" ]; then
            bun scripts/index-corpus.ts --force
          else
            bun scripts/index-corpus.ts
          fi
