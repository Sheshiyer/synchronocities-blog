# Cloudflare Workers config for the synchronocities AI service.
#
# Multi-model NVIDIA NIM router. Phase A is minimal — just enough to deploy
# and discover the NIM model catalog. Phase B (subsequent tasks) re-enables
# Vectorize, R2, Queues, and the surface endpoints.
#
# Production secret: `wrangler secret put NVIDIA_API_KEY` (one-time, prompted)

name = "synchronocities-ai"
main = "src/index.ts"
compatibility_date = "2026-05-20"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1.0

# ────────────────────────────────────────────────────────────────────────────
# VARS — non-secret config baked into the Worker
# ────────────────────────────────────────────────────────────────────────────

[vars]
NIM_BASE_URL = "https://integrate.api.nvidia.com/v1"

# Model selection — VALIDATED via /test/probe-one against this account's
# actual inference tier. The /v1/models catalog lists ~125 models but only
# a subset are callable; these five are confirmed working.
#
# Notable findings during discovery:
#   • nv-embedqa-mistral-7b-v2 (the "obvious" choice) → 404 on this tier
#   • nv-embed-v1 (4096-d) → works, but EXCEEDS Cloudflare Vectorize cap
#     (1536-d max). Swapped to nv-embedqa-e5-v5 (1024-d) which fits.
#   • nemotron-super-49b-v1.5 → returns empty content (reasoning model puts
#     output in reasoning_content; wrapper would need handling to use it)
#   • nemotron-nano-3-30b-a3b → model does not exist
#   • mistralai/mistral-large → 404 on this tier
#
# Overridable per-surface in src/routing.ts (phase B).

NIM_EMBED_MODEL         = "nvidia/nv-embedqa-e5-v5"                       # 1024-d, 585ms — fits Vectorize cap (1536-d max)
NIM_CHAT_MODEL          = "meta/llama-3.3-70b-instruct"                   # 70B, 387ms — primary synthesis
NIM_RERANK_MODEL        = "nvidia/nemotron-mini-4b-instruct"              # 4B, 405ms — LLM-as-judge rerank
NIM_CLUSTER_LABEL_MODEL = "nvidia/nemotron-mini-4b-instruct"              # same cheap model — cluster naming
NIM_SAFETY_MODEL        = "nvidia/llama-3.1-nemoguard-8b-content-safety"  # 453ms — content moderation on /chat

# Bumped to 2 after the embed model swap (1024-d invalidates all 4096-d cached vectors).
# Bumped to 3 to reindex with body_excerpt in Vectorize metadata (Task 5 of /expand/v2 plan).
# Bumped to 4 to widen the corpus from 125 blog posts to ~3,600 vault docs
# (Task 13 of /expand/v2.1 — vault indexer adds source_type/source_path metadata).
CORPUS_VERSION = "4"

# ────────────────────────────────────────────────────────────────────────────
# KV — query cache (binds to existing CACHE namespace from `wrangler kv namespace list`)
# ────────────────────────────────────────────────────────────────────────────

[[kv_namespaces]]
binding = "CACHE"
id = "29c134656fca4bada93e1c3b5313b3fa"
preview_id = "d841c52982cb4ae3917975bdd1061ce0"

# ────────────────────────────────────────────────────────────────────────────
# PHASE-B BINDINGS — re-enable after running setup commands in README
# ────────────────────────────────────────────────────────────────────────────

[[vectorize]]
binding = "CORPUS_INDEX"
index_name = "synchronocities-corpus"
# Created with: wrangler vectorize create synchronocities-corpus --dimensions=1024 --metric=cosine

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "synchronocities-artifacts"
# Created with: wrangler r2 bucket create synchronocities-artifacts

