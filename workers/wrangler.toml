# Cloudflare Workers config for the synchronocities AI service.
#
# Multi-model NVIDIA NIM router. Phase B is live: Vectorize, R2, and all
# surface endpoints are active. Queues remain scaffolded (commented out below).
#
# Production secrets: `wrangler secret put NVIDIA_API_KEY` / `ADMIN_API_KEY` (one-time, prompted)

name = "synchronocities-ai"
main = "src/index.ts"
compatibility_date = "2026-05-20"
compatibility_flags = ["nodejs_compat"]

# Migrated 2026-07-20 from the tirak-court account to the owner's account.
account_id = "9d9d23b27f32e70ae3afb6a1aa2c0f10"

# Custom domain on the tryambakam.space zone (3c1066df55d4e99464c8bcf1f850894b),
# added 2026-09-12. Cloudflare creates the DNS record and provisions the cert.
#
# ⚠️ ONE level deep, deliberately. The zone is on the Free plan, whose Universal SSL
# covers exactly `tryambakam.space` and `*.tryambakam.space` — not `*.*.tryambakam.space`.
# The first attempt used ai.synchronocities.tryambakam.space; DNS resolved but TLS never
# came up (curl exit 35) because no certificate can cover a second label on this plan.
# Going deeper needs Advanced Certificate Manager (~$10/mo) or a Business plan.
routes = [
  { pattern = "synchronocities-ai.tryambakam.space", custom_domain = true }
]

# ⚠️ REQUIRED alongside `routes`. Wrangler DISABLES the *.workers.dev subdomain by
# default the moment a route is declared — observed 2026-09-12, when adding the custom
# domain above took synchronocities-ai.sheshnarayan-iyer.workers.dev to 404. That URL is
# hardcoded in every ops script (index-corpus.ts, index-vault.ts, probe-catalog.ts,
# expand-*.ts, semantic-vectorizer.py, eval-embed.py), in the integration tests, and in
# .github/workflows/synchronocities-ai-deploy.yml. Keep this true until those are migrated.
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 1.0

# ────────────────────────────────────────────────────────────────────────────
# VARS — non-secret config baked into the Worker
# ────────────────────────────────────────────────────────────────────────────

[vars]
NIM_BASE_URL = "https://integrate.api.nvidia.com/v1"

# Model selection — VALIDATED via /test/probe-one against this account's
# actual inference tier. The /v1/models catalog lists ~125 models but only
# a subset are callable; these five are confirmed working.
#
# Notable findings during discovery:
#   • nv-embedqa-mistral-7b-v2 (the "obvious" choice) → 404 on this tier
#   • nv-embed-v1 (4096-d) → works, but EXCEEDS Cloudflare Vectorize cap
#     (1536-d max). Swapped to nv-embedqa-e5-v5 (1024-d) which fits.
#   • nemotron-super-49b-v1.5 → returns empty content (reasoning model puts
#     output in reasoning_content; wrapper would need handling to use it)
#   • nemotron-nano-3-30b-a3b → model does not exist
#   • mistralai/mistral-large → 404 on this tier
#
# Overridable per-surface in src/routing.ts (phase B).

# ── EMBEDDINGS: moved OFF NVIDIA NIM, 2026-09-12 ────────────────────────────
# nvidia/nv-embedqa-e5-v5 reached end of life 2026-08-25 and NVIDIA now returns HTTP 410
# for it (confirmed via `wrangler tail` on a live /search, and it is gone from /v1/models).
# That took out /search, /chat, /embed/batch and POST /maps/cluster — everything that
# embeds NEW text. /related/:slug survived because it reads a STORED vector by id.
#
# No NIM replacement fits: Cloudflare Vectorize caps at 1536-d and every embed model left
# on this tier is wider — nemotron-3-embed-1b (2048), llama-nemotron-embed-1b-v2 (2048),
# llama-nemotron-embed-vl-1b-v2 (2048), nv-embed-v1 (4096), nv-embedcode-7b-v1 (4096).
#
# So embeddings now route to Nebius (EMBED_BASE_URL below) while chat, rerank and safety
# stay on NIM. Qwen3-Embedding-8B is natively 4096-d but supports Matryoshka truncation
# via the OpenAI `dimensions` param — verified 2026-09-12 returning exactly 1024, 1536 and
# 4096 on request, and batching correctly. 1024 is chosen to match the EXISTING
# synchronocities-corpus index geometry, so no new index is needed.
#
# ⚠️ EMBED_DIMENSIONS must equal the Vectorize index dimension. nim.ts hard-fails if the
# provider returns a different width rather than silently corrupting the index.
NIM_EMBED_MODEL         = "Qwen/Qwen3-Embedding-8B"                       # 1024-d via MRL truncation
EMBED_BASE_URL          = "https://api.studio.nebius.com/v1"              # OpenAI-compatible
EMBED_DIMENSIONS        = "1024"                                          # MUST match the index
# Swapped 2026-07-20: llama-3.3-70b-instruct went unreachable on the NIM tier
# (daily probe 2026-07-18 timeout; live /chat verification 2026-07-20 returned
# 0 bytes in 110s). Replacement confirmed reachable in the same probe snapshot.
NIM_CHAT_MODEL          = "nvidia/nemotron-3-super-120b-a12b"             # 120B, 385ms — primary synthesis
# ── RERANK + CLUSTER LABELLING: moved OFF NVIDIA NIM, 2026-09-12 ────────────
# nemotron-mini-4b-instruct went unreachable in the same tier contraction that
# killed the embed model (2026-09-11 daily probe: 39 -> 12 reachable). Rerank was
# failing open, so /search answered but every rerank_score was the neutral 5.
#
# No NIM replacement works: every reachable candidate is a REASONING model that
# emits chain-of-thought into `content` (nemotron-3.5-lightning-30b-a3b probes OK
# but returns "Here's a thinking process:"), which would corrupt parseScores().
# The same trap is documented for nemotron-super-49b-v1.5 above.
#
# Qwen3-30B-A3B-Instruct-2507 on Nebius is an INSTRUCT model, so it emits the bare
# comma-separated integers the parser expects. Routed via RERANK_BASE_URL; the
# cluster-label surface follows it (routing.ts marks it upstream: 'rerank') since
# it shared the same dead model.
NIM_RERANK_MODEL        = "Qwen/Qwen3-30B-A3B-Instruct-2507"
NIM_CLUSTER_LABEL_MODEL = "Qwen/Qwen3-30B-A3B-Instruct-2507"
RERANK_BASE_URL         = "https://api.studio.nebius.com/v1"              # OpenAI-compatible
NIM_SAFETY_MODEL        = "nvidia/llama-3.1-nemoguard-8b-content-safety"  # 453ms — content moderation on /chat

# Bumped to 2 after the embed model swap (1024-d invalidates all 4096-d cached vectors).
# Bumped to 3 to reindex with body_excerpt in Vectorize metadata (Task 5 of /expand/v2 plan).
# Bumped to 4 to widen the corpus from 125 blog posts to ~3,600 vault docs
# (Task 13 of /expand/v2.1 — vault indexer adds source_type/source_path metadata).
#
# Bumped to 5 on 2026-09-12 for the Qwen3-Embedding-8B reindex. The previous 28,290
# vectors were produced by the now-dead e5-v5 and are in a different vector language —
# query vectors from the new model do not match them (observed scores ~0.09 with
# semantically unrelated neighbours). CORPUS_VERSION also keys the KV query cache and
# the R2 cluster artifact, so bumping it invalidates both in the same move.
CORPUS_VERSION = "5"

# Feature flag: bounded tool-use loop inside /chat (lib/chat-tools.ts).
# "1" = one tool-planning round before the final stream (max 2 rounds,
# max 3 tool calls; silent fallback on any error). "0" = legacy single-pass.
CHAT_TOOLS = "1"

# ────────────────────────────────────────────────────────────────────────────
# KV — query cache
#
# ⚠️ Match on ID, never on title. This Cloudflare account is shared across many projects
# and contains a SEPARATE, unrelated namespace literally titled "CACHE"
# (d5aa9b42b2f948bfa59143d5a56ea58b). The ids below are the synchronocities ones; in the
# dashboard / `wrangler kv namespace list` they appear as SYNCHRONOCITIES_CACHE and
# SYNCHRONOCITIES_CACHE_preview. Verified 2026-09-12. (An earlier version of this comment
# claimed the binding pointed at the namespace titled "CACHE" — it does not, and
# "correcting" it to match that title would silently repoint the cache at another project.)
# ────────────────────────────────────────────────────────────────────────────

[[kv_namespaces]]
binding = "CACHE"
id = "5e7bd8128b7b47cba0df0b11cb26aa88"
preview_id = "bd18e5cfec954e14b97f9af3b1ec5028"

# ────────────────────────────────────────────────────────────────────────────
# PHASE-B BINDINGS — re-enable after running setup commands in README
# ────────────────────────────────────────────────────────────────────────────

[[vectorize]]
binding = "CORPUS_INDEX"
index_name = "synchronocities-corpus"
# Created with: wrangler vectorize create synchronocities-corpus --dimensions=1024 --metric=cosine

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "synchronocities-artifacts"
# Created with: wrangler r2 bucket create synchronocities-artifacts

# [[queues.producers]]
# binding = "EMBED_QUEUE"
# queue = "synchronocities-embed-jobs"

# [[queues.consumers]]
# queue = "synchronocities-embed-jobs"
# max_batch_size = 8
# max_batch_timeout = 10
# max_retries = 3
# dead_letter_queue = "synchronocities-embed-dlq"

# Native rate limiter for /chat — 20 requests/minute per IP (keyed on
# CF-Connecting-IP in routes/chat.ts). When this binding is absent (e.g.
# `wrangler dev`), chat.ts falls back to a 10 req/min in-isolate limiter.
#
# NOTE (compatibility_flags): the old comment claimed this requires the
# `unsafe-bindings` flag. That flag does not exist in wrangler 4 — `[[unsafe.bindings]]`
# is accepted as-is and `unsafe_*` compatibility flags were removed in wrangler 4
# (docs.cloudflare.com/workers/wrangler/configuration/#unsafe-bindings). Flags
# left unchanged at ["nodejs_compat"]; validated with `wrangler deploy --dry-run`.
[[unsafe.bindings]]
name = "CHAT_RATE_LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
