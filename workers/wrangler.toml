# Cloudflare Workers config for the synchronocities AI service.
#
# Multi-model NVIDIA NIM router. Phase A is minimal — just enough to deploy
# and discover the NIM model catalog. Phase B (subsequent tasks) re-enables
# Vectorize, R2, Queues, and the surface endpoints.
#
# Production secret: `wrangler secret put NVIDIA_API_KEY` (one-time, prompted)

name = "synchronocities-ai"
main = "src/index.ts"
compatibility_date = "2026-05-20"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1.0

# ────────────────────────────────────────────────────────────────────────────
# VARS — non-secret config baked into the Worker
# ────────────────────────────────────────────────────────────────────────────

[vars]
NIM_BASE_URL = "https://integrate.api.nvidia.com/v1"

# Model selection — chosen from this NIM key's accessible catalog (125 models).
# Two-tier chat (expensive synthesis + cheap utility) since the catalog has
# no dedicated rerank model — utility tier doubles as LLM-as-judge reranker.
# Overridable per-surface in src/routing.ts (phase B).

NIM_EMBED_MODEL  = "nvidia/nv-embedqa-mistral-7b-v2"          # 7B, 4096-d retrieval-optimized
NIM_CHAT_MODEL   = "nvidia/llama-3.3-nemotron-super-49b-v1.5" # MoE 49B, instruction+reasoning, primary synthesis
NIM_RERANK_MODEL = "nvidia/nemotron-nano-3-30b-a3b"           # MoE 30B (~3B active), LLM-as-judge rerank
NIM_CLUSTER_LABEL_MODEL = "nvidia/nemotron-nano-3-30b-a3b"    # same cheap model — cluster naming
NIM_SAFETY_MODEL = "nvidia/llama-3.1-nemoguard-8b-content-safety"  # phase-B input moderation on /chat

CORPUS_VERSION = "1"

# ────────────────────────────────────────────────────────────────────────────
# KV — query cache (binds to existing CACHE namespace from `wrangler kv namespace list`)
# ────────────────────────────────────────────────────────────────────────────

[[kv_namespaces]]
binding = "CACHE"
id = "29c134656fca4bada93e1c3b5313b3fa"
preview_id = "d841c52982cb4ae3917975bdd1061ce0"

